services:
  image-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?required}
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    restart: unless-stopped
